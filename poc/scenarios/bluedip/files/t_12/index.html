<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluedip: fill your quiet hours</title>
<style>
:root{--ink:#14213d;--muted:#5b6478;--line:#dfe4ee;--ground:#f4f7fc;--blue:#1d5fd1;--quiet:#9db7e8;--good:#1f7a45;--goodbg:#e2f3e8;--bad:#a4302a;--badbg:#fbe5e3}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--ground)}
header{padding:16px max(22px,calc(50% - 528px));background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:21px}h1 span{color:var(--blue)}
h2{font-size:16px;margin:0 0 10px}
main{padding:18px 22px;display:grid;gap:16px;max-width:1100px;margin:0 auto}
main>*{min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);white-space:nowrap}
.bar i{display:block;width:100%;background:var(--blue);border-radius:5px 5px 0 0}
.bar.quiet i{background:var(--quiet)}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.meal b{text-transform:capitalize}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.good{background:var(--goodbg);color:var(--good)}.bad{background:var(--badbg);color:var(--bad)}
form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;padding:7px 10px;border:1px solid #c6cfdf;border-radius:8px;background:#fff;color:var(--ink);min-height:38px;width:110px}
input[type=date]{width:170px}
.tscroll{overflow-x:auto}
@media (max-width:560px){header,main{padding-left:16px;padding-right:16px}.chart{gap:3px}.bar{font-size:12px}.bar:nth-child(even) span{visibility:hidden}input{width:96px}input,button{min-height:44px}}
button{font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--blue);background:var(--blue);color:#fff;min-height:38px;cursor:pointer}
button.ghost{background:#fff;color:var(--blue)}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.est div{background:var(--ground);border-radius:10px;padding:10px}
.est b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.err{color:var(--bad);min-height:1.4em}
</style>
</head>
<body>
<header>
  <div><h1><span>Blue</span>dip</h1><div class="muted" id="who">Loading…</div></div>
  <label>Day<input type="date" id="day"></label>
</header>
<main>
  <section class="card">
    <h2>Expected footfall, hour by hour</h2>
    <div class="muted" id="totals"></div>
    <div class="chart" id="chart" aria-label="Expected covers by hour"></div>
    <div class="muted">Pale bars are quiet hours.</div>
  </section>
  <section class="meals" id="meals"></section>
  <section class="card">
    <h2>Create a limited-time offer</h2>
    <form id="offer">
      <label>From (hour)<input name="start" type="number" min="0" max="23" value="13"></label>
      <label>Until (hour)<input name="end" type="number" min="1" max="24" value="16"></label>
      <label>Discount %<input name="discount" type="number" min="5" max="50" step="5" value="50"></label>
      <label>Max customers<input name="cap" type="number" min="1" value="15"></label>
      <button type="button" class="ghost" id="preview">Estimate</button>
      <button type="submit">Create offer</button>
    </form>
    <div class="err" id="err" role="alert"></div>
    <div id="estimate"></div>
  </section>
  <section class="card">
    <h2>Your offers</h2>
    <div class="tscroll"><table><thead><tr><th>Offer</th><th>Window</th><th>Discount</th><th>Used</th><th>Estimated margin</th><th></th></tr></thead>
    <tbody id="offers"></tbody></table></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const inr = (n) => (n < 0 ? "−₹" : "₹") + Math.abs(Math.round(n)).toLocaleString("en-IN");
const delta = (n) => (n > 0 ? "+" : "") + inr(n);
const about = (n) => `about ${Math.round(n)}`;
const hh = (h) => `${h % 12 || 12} ${h < 12 || h === 24 ? "AM" : "PM"}`;
async function api(path, body) {
  const res = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.statusText);
  return out;
}
function offerBody() {
  const f = new FormData($("#offer"));
  return {date: $("#day").value, start: +f.get("start"), end: +f.get("end"), discount: +f.get("discount") / 100, cap: +f.get("cap")};
}
function estimateCard(e, better) {
  const tone = e.margin_change >= 0 ? "good" : "bad";
  const a = e.assumptions;
  return `<div class="est">
    <div><span class="muted">Expected without the offer</span><b>${about(e.expected_without)} covers</b></div>
    <div><span class="muted">Customers using it</span><b>${about(e.customers_using)}</b>${e.cap_reached ? '<span class="muted">cap reached</span>' : ""}</div>
    <div><span class="muted">New customers it brings</span><b>${about(e.new_customers)}</b></div>
    <div><span class="muted">Would have come anyway</span><b>${about(e.would_have_come_anyway)}</b></div>
    <div><span class="muted">Revenue change</span><b>${delta(e.revenue_change)}</b></div>
    <div><span class="muted">Margin change, after food cost</span><b><span class="pill ${tone}">${delta(e.margin_change)}</span></b></div></div>
    <p class="muted">Assumes an average bill of ${inr(a.avg_bill)}, food cost ${Math.round(a.food_cost * 100)}% of it${a.food_cost_assumed ? " (an assumption until you enter yours)" : ""}, and a customer response learned so far of ${a.response}.</p>
    ${better && Math.abs(better.discount - offerBody().discount) > 1e-9 ? `<p><b>Better:</b> ${Math.round(better.discount * 100)}% off brings ${about(better.new_customers)} new customers, revenue ${delta(better.revenue_change)}, margin ${delta(better.margin_change)}.</p>` : ""}`;
}
async function load() {
  const d = await api(`/api/day?date=${$("#day").value}`);
  $("#who").textContent = `${d.restaurant.name}${d.sample ? " (sample data until your own arrives)" : ""}`;
  $("#totals").textContent = `${about(d.covers)} covers and ${inr(d.revenue)} expected on ${d.date}.`;
  const quiet = new Set(d.slots.flatMap((s) => s.quiet ? Array.from({length: s.quiet[1] - s.quiet[0]}, (_, i) => s.quiet[0] + i) : []));
  const top = Math.max(...d.hours.map((h) => h.covers), 1);
  $("#chart").innerHTML = d.hours.map((h) => `<div class="bar ${quiet.has(h.hour) ? "quiet" : ""}" title="${h.covers} covers, ${inr(h.revenue)}"><i style="height:${Math.round(h.covers / top * 120)}px"></i><span>${hh(h.hour)}</span></div>`).join("");
  $("#meals").innerHTML = d.recommendations.map((r, i) => { const s = d.slots[i]; const o = r.offer;
    return `<div class="card meal"><b>${r.slot}</b> <span class="muted">${about(s.covers)} covers, ${inr(s.revenue)}</span>
      <p class="muted" style="margin:6px 0">${r.window ? `Quiet ${hh(r.window[0])} to ${hh(r.window[1])}.` : ""} ${r.why}</p>
      ${o ? `<p style="margin:0">${Math.round(o.discount * 100)}% off, up to ${o.cap} customers: ${about(o.new_customers)} new, margin <span class="pill good">${delta(o.margin_change)}</span></p>
      <button class="ghost" data-use="${r.window[0]},${r.window[1]},${o.discount},${o.cap}" style="margin-top:8px">Use this</button>` : ""}</div>`; }).join("");
  const rows = await api("/api/offers");
  $("#offers").innerHTML = rows.map((o) => `<tr><td>${o.id}</td><td>${o.date}, ${hh(o.start)} to ${hh(o.end)}</td><td>${Math.round(o.discount * 100)}%</td>
    <td>${o.redeemed} of ${o.cap}</td><td>${delta(o.estimate.margin_change)}</td>
    <td>${o.status === "live" && o.redeemed < o.cap ? `<button class="ghost" data-redeem="${o.id}">Customer used it</button>` : o.status}</td></tr>`).join("");
}
async function preview() {
  $("#err").textContent = "";
  try { const r = await api("/api/offers/estimate", offerBody()); $("#estimate").innerHTML = estimateCard(r.estimate, r.better); }
  catch (e) { $("#estimate").innerHTML = ""; $("#err").textContent = e.message; }
}
document.addEventListener("click", async (ev) => {
  const use = ev.target.dataset.use, redeem = ev.target.dataset.redeem;
  if (use) { const [s, e, d, c] = use.split(","); const f = $("#offer");
    f.start.value = s; f.end.value = e; f.discount.value = Math.round(d * 100); f.cap.value = c; preview(); }
  if (redeem) { try { await api(`/api/offers/${redeem}/redeem`, {}); load(); } catch (e) { $("#err").textContent = e.message; } }
});
$("#preview").addEventListener("click", preview);
$("#offer").addEventListener("submit", async (ev) => {
  ev.preventDefault(); $("#err").textContent = "";
  try { await api("/api/offers", offerBody()); await preview(); load(); } catch (e) { $("#err").textContent = e.message; }
});
$("#day").addEventListener("change", () => { load(); preview(); });
const now = new Date();
$("#day").value = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("-");
load().then(preview);
</script>
</body>
</html>
