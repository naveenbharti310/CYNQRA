<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covers forecast</title>
<style>
  :root { --ink: #1d2327; --muted: #5f6b73; --bar: #2f6f5e; --weekend: #b5642a; --line: #dde3e6; }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: #fbfaf7; margin: 0; padding: 16px; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .note { color: var(--muted); margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.weekend td:first-child { color: var(--weekend); font-weight: 600; }
  .bar { height: 10px; background: var(--bar); border-radius: 2px; }
  tr.weekend .bar { background: var(--weekend); }
  .sample { background: #fff4d6; padding: 8px 10px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Covers for the next 14 days</h1>
  <p class="note">Expected covers each day and how many to prep for. Weekends are marked.</p>
  <p id="sample" class="sample" hidden>This is a sample history. Enter your own covers to replace it.</p>
  <table>
    <thead><tr><th>Day</th><th>Expected covers</th><th>Prep for</th><th></th></tr></thead>
    <tbody id="days"></tbody>
  </table>
</main>
<script>
fetch("/api/forecast").then(r => r.json()).then(f => {
  document.getElementById("sample").hidden = !f.sample;
  const top = Math.max(1, ...f.days.map(d => d.prep));
  document.getElementById("days").innerHTML = f.days.map(d =>
    `<tr class="${d.weekend ? "weekend" : ""}"><td>${d.weekday} ${d.date}</td><td class="num">${d.covers}</td>` +
    `<td class="num">${d.prep}</td><td style="width:40%"><div class="bar" style="width:${100 * d.prep / top}%"></div></td></tr>`
  ).join("");
});
</script>
</body>
</html>
