name: cynqra-probe
on:
  workflow_dispatch:
  push:
    branches: [cynqra]
    paths: [".github/workflows/cynqra-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Release assets and model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== llama.cpp releases"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=4" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              print(r['tag_name'], r['published_at'], r['prerelease'], len(r['assets']))
              for a in r['assets'][:40]: print('   ', a['name'], a['size']//1048576, 'MB')"
          echo "== python-build-standalone latest"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest" | python3 -c "
          import json,sys
          r=json.load(sys.stdin); print(r['tag_name'])
          for a in r['assets']:
              n=a['name']
              if n.startswith('cpython-3.12') and 'install_only' in n and 'stripped' not in n and any(t in n for t in ('x86_64-pc-windows-msvc','aarch64-apple-darwin','x86_64-apple-darwin','x86_64-unknown-linux-gnu')):
                  print('   ', n, a['size']//1048576, 'MB')"
          for repo in unsloth/Qwen3.6-35B-A3B-GGUF bartowski/Qwen_Qwen3.6-35B-A3B-GGUF unsloth/Qwen3.5-9B-GGUF lmstudio-community/Qwen3.5-9B-GGUF bartowski/Qwen_Qwen3.5-9B-GGUF unsloth/Qwen3.5-4B-GGUF unsloth/Qwen3.6-27B-GGUF ggml-org/gpt-oss-20b-GGUF unsloth/gpt-oss-20b-GGUF; do
            echo "== $repo"
            curl -sS "https://huggingface.co/api/models/$repo/tree/main?recursive=true" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if isinstance(d, dict): print('   ', d); sys.exit()
          for f in d:
              p=f.get('path','')
              if p.endswith('.gguf') and any(q in p.upper() for q in ('Q4_K_M','MXFP4','Q8_0','MMPROJ')):
                  print('   ', p, f.get('size',0)//1048576, 'MB', (f.get('lfs') or {}).get('oid','')[:12])"
          done
  mac:
    runs-on: macos-latest
    steps:
      - run: uname -m; sysctl -n hw.memsize hw.ncpu machdep.cpu.brand_string; sw_vers
