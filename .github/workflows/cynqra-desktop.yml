# Cynqra desktop app: build the installers for Windows, macOS and Linux, then install each one on a
# fresh GitHub machine the way a user would and check it with a real open model.
#
#   every push             unit tests; build; install; self-test; open the window; a real model
#                          structures an objective and writes code that passes its tests: Qwen3.6
#                          35B-A3B 2-bit (the model a 16 GB laptop gets) on Windows and Linux, Qwen3.5
#                          4B on the 7 GB macOS machine; launch like a user and quit; on Windows also
#                          uninstall and reinstall into a folder with spaces and accents
#   "[e2e]" in the commit  also a whole Cynqra run, from the founder's sentence to a deployed, verified
#                          product: the 16 GB model on Linux and Windows, gpt-oss 20B on Linux
#   "[release]"            also publishes the installers as a GitHub prerelease
name: cynqra-desktop

on:
  push:
    branches: [cynqra]
    paths: ["poc/**", "desktop/**", ".github/workflows/cynqra-desktop.yml"]

permissions:
  contents: read

concurrency:
  group: cynqra-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_OBJECTIVE: >-
    I run a small bakery and my staff keep losing track of custom cake orders. I want a simple internal web
    page where they can log an order with the pickup date, see what is due in the next few days, and mark
    orders as paid and picked up. Nothing public, no card payments, and it has to run on the shop laptop.
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Unit and journey tests
        working-directory: poc
        run: python3 -m unittest discover -s tests -t tests

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: windows-x64, model: qwen3.6-35b-a3b-q2}
          - {os: macos-latest, target: macos-arm64, model: qwen3.5-4b}
          - {os: ubuntu-latest, target: linux-x64, model: qwen3.6-35b-a3b-q2}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build the installer
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} desktop/build.py --target ${{ matrix.target }}

      # ---- install it the way a user would --------------------------------------------------------
      - name: Install (Windows installer, silent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Cynqra-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Cynqra"
          if (-not (Test-Path "$app\python\pythonw.exe")) { throw "not installed at $app" }
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Cynqra*.lnk" | ForEach-Object { "Start menu: $($_.Name)" }
          "CYNQRA=$app\python\python.exe -X utf8 $app\app\desktop.py" | Out-File -Append $env:GITHUB_ENV
      - name: Install (macOS disk image)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/Cynqra-*.dmg -mountpoint /Volumes/Cynqra -nobrowse
          mkdir -p ~/Applications && cp -R /Volumes/Cynqra/Cynqra.app ~/Applications/
          hdiutil detach /Volumes/Cynqra
          codesign --verify --deep --strict ~/Applications/Cynqra.app && echo "signature valid (ad hoc)"
          spctl --assess --type execute -vv ~/Applications/Cynqra.app || echo "Gatekeeper: not notarized, so macOS asks once before the first launch"
          echo "CYNQRA=$HOME/Applications/Cynqra.app/Contents/MacOS/Cynqra" >> $GITHUB_ENV
      - name: Install (Linux archive)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/unpack && tar xzf dist/Cynqra-*-linux-x64.tar.gz -C /tmp/unpack
          /tmp/unpack/Cynqra/install.sh
          echo "CYNQRA=$HOME/.local/bin/cynqra" >> $GITHUB_ENV

      # ---- check the installed app ---------------------------------------------------------------
      - name: Self-test (bundled Python and llama-server, app server, engine, model files on Hugging Face)
        timeout-minutes: 10
        run: $CYNQRA --selftest --online
      - name: Open the window and load the app
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a $CYNQRA --window-test; else $CYNQRA --window-test; fi
      - name: A real open model on this machine (download, llama-server, objective, code that passes its tests)
        timeout-minutes: 75
        run: $CYNQRA --check-model ${{ matrix.model }}
      - name: Launch like a user (Start menu shortcut), let the window load, Quit
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $data = "$env:LOCALAPPDATA\Cynqra"
          Remove-Item "$data\instance.json" -ErrorAction SilentlyContinue
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Cynqra.lnk")
          "Shortcut: $($lnk.TargetPath) $($lnk.Arguments)"
          $p = Start-Process $lnk.TargetPath -ArgumentList $lnk.Arguments -WorkingDirectory $lnk.WorkingDirectory -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$data\instance.json"); $i++) { Start-Sleep 1 }
          $url = (Get-Content "$data\instance.json" | ConvertFrom-Json).url
          Start-Sleep 20
          $st = Invoke-RestMethod "$url/api/state"
          "desktop=$($st.desktop) model=$($st.runtime.model) state=$($st.runtime.state) window_polls=$($st.window_polls)"
          New-Item -ItemType Directory -Force out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\out\windows-app-window.png")
          $w = [Math]::Min(1280, $b.Width); $h = [int]($b.Height * $w / $b.Width)
          $small = New-Object System.Drawing.Bitmap $bmp, $w, $h
          $jpg = "$PWD\out\windows-app-window.jpg"
          $small.Save($jpg, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          "SCREENSHOT-BEGIN"; [Convert]::ToBase64String([IO.File]::ReadAllBytes($jpg)) -split '(.{1,120})' | Where-Object { $_ }; "SCREENSHOT-END"
          if ($st.window_polls -lt 1) { throw "the Cynqra window did not load the app (no polls from its page)" }
          Invoke-RestMethod -Method Post "$url/api/app/quit" -Body '{}' -ContentType 'application/json'
          $p.WaitForExit(30000) | Out-Null
          if (-not $p.HasExited) { throw "Cynqra did not exit after Quit" }
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "llama-server still running after Quit" }
          Get-Content "$data\app.log" -Tail 15
          "PASS: launched from the Start menu, the Edge app window loaded Cynqra, quit cleanly"
      - name: Uninstall, then reinstall into a folder with spaces and accents
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Cynqra"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          if (Test-Path "$app\python") { throw "uninstall left the program files" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Cynqra.lnk") { throw "uninstall left the Start menu shortcut" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Cynqra\runtime\models")) { throw "uninstall deleted the downloaded models without asking" }
          "PASS: uninstalled; downloaded models kept"
          $odd = "$env:RUNNER_TEMP\Program Files Tést\Cynqra Ü"
          $setup = Get-ChildItem dist\Cynqra-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=""$odd""" -Wait
          if (-not (Test-Path "$odd\python\pythonw.exe")) { throw "not installed at $odd" }
          $env:CYNQRA_DATA_DIR = "$env:RUNNER_TEMP\Données de l'équipe\Cynqra"
          & "$odd\python\python.exe" -X utf8 "$odd\app\desktop.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed from a path with spaces and accents" }
          "PASS: installed and self-tested at '$odd' with data in '$env:CYNQRA_DATA_DIR'"
      - name: Launch like a user (open Cynqra.app), let the window load, Quit
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then DATA="$HOME/Library/Application Support/Cynqra"; else DATA="$HOME/.local/share/cynqra"; fi
          rm -f "$DATA/instance.json"
          if [ "$RUNNER_OS" = "macOS" ]; then open ~/Applications/Cynqra.app; else
            EXEC=$(grep '^Exec=' ~/.local/share/applications/cynqra.desktop | cut -d= -f2-); (xvfb-run -a "$EXEC" &) ; fi
          for i in $(seq 60); do [ -f "$DATA/instance.json" ] && break; sleep 1; done
          URL=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['url'])" "$DATA/instance.json")
          sleep 15
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then screencapture -x out/macos-app-window.png || true; fi
          curl -sf "$URL/api/state" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d['runtime']; print('desktop', d['desktop'], 'model', r['model'], 'state', r['state'], 'window_polls', d['window_polls']); sys.exit(0 if d['window_polls'] > 0 else 'the Cynqra window did not load the app')"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' "$URL/api/app/quit"; echo
          for i in $(seq 30); do pgrep -f "app/desktop.py" >/dev/null || break; sleep 1; done
          if pgrep -f "app/desktop.py"; then echo "Cynqra did not exit after Quit"; exit 1; fi
          if pgrep -x llama-server; then echo "llama-server still running after Quit"; exit 1; fi
          tail -15 "$DATA/app.log"
          echo "PASS: launched like a user, the window loaded Cynqra, quit cleanly"
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp dist/Cynqra* out/ 2>/dev/null || true
          for d in "$LOCALAPPDATA/Cynqra" "$HOME/Library/Application Support/Cynqra" "$HOME/.local/share/cynqra"; do
            [ -d "$d" ] && cp "$d"/selftest.json "$d"/runtime/llama-server.log "$d"/app.log out/ 2>/dev/null || true
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cynqra-${{ matrix.target }}
          path: out/
          if-no-files-found: warn

  e2e:
    needs: build
    if: ${{ !cancelled() && contains(github.event.head_commit.message, '[e2e]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-x64, model: qwen3.6-35b-a3b-q2}
          - {os: windows-latest, target: windows-x64, model: qwen3.6-35b-a3b-q2}
          - {os: ubuntu-latest, target: linux-x64, model: gpt-oss-20b}
    name: e2e (${{ matrix.target }}, ${{ matrix.model }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 358
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cynqra-${{ matrix.target }}
          path: dist
      - name: Install
        shell: pwsh
        run: |
          if ($IsWindows) {
            $setup = Get-ChildItem dist\Cynqra-Setup-*.exe | Select-Object -First 1
            Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            $app = "$env:LOCALAPPDATA\Programs\Cynqra"
            "CYNQRA=$app\python\python.exe -X utf8 $app\app\desktop.py" | Out-File -Append $env:GITHUB_ENV
          } else {
            New-Item -ItemType Directory -Force /tmp/unpack | Out-Null
            tar xzf (Get-ChildItem dist/Cynqra-*-linux-x64.tar.gz | Select-Object -First 1).FullName -C /tmp/unpack
            /tmp/unpack/Cynqra/install.sh
            "CYNQRA=$env:HOME/.local/bin/cynqra" | Out-File -Append $env:GITHUB_ENV
          }
      - name: The whole Cynqra journey with a real model, through the app's own API
        run: $CYNQRA --e2e ${{ matrix.model }} "$E2E_OBJECTIVE" --max-minutes 340
      - name: Collect the report and the product the organization built
        if: always()
        run: |
          mkdir -p out
          for d in "$LOCALAPPDATA/Cynqra" "$HOME/.local/share/cynqra"; do
            [ -d "$d/reports" ] && cp -r "$d/reports" out/ ; [ -f "$d/runtime/llama-server.log" ] && cp "$d/runtime/llama-server.log" out/
          done
          ls -laR out | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cynqra-e2e-${{ matrix.target }}-${{ matrix.model }}
          path: out/

  release:
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cynqra-*-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: cynqra-macos-arm64
          path: artifacts/mac
      - name: Publish the installers as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat desktop/VERSION)
          TAG="cynqra-v$VERSION"
          files=$(find artifacts -type f \( -name 'Cynqra-Setup-*.exe' -o -name 'Cynqra-*.dmg' -o -name 'Cynqra-*-linux-x64.tar.gz' -o -name '*.sha256' \))
          echo "$files"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file desktop/RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" $files --prerelease --target "$GITHUB_SHA" \
              --title "Cynqra $VERSION (proof of concept)" --notes-file desktop/RELEASE_NOTES.md
          fi
