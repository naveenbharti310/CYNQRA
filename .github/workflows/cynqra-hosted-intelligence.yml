name: cynqra-hosted-intelligence

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Hosted provider to examine
        required: true
        type: choice
        options: [all, google, nvidia, anthropic]
        default: all
      max_models:
        description: Maximum number of current candidates to probe
        required: true
        default: "4"
      objective:
        description: Optional objective to run through the objective intelligence loop to its first bindings
        required: false
        default: ""
      budget_usd:
        description: Hard cap for the objective run, in US dollars
        required: false
        default: "1"
      anthropic_workspace_id:
        description: Claude workspace ID (wrkspc_...), needed when the Claude key is not scoped to one workspace
        required: false
        default: ""

permissions:
  contents: read

jobs:
  examine:
    name: Discover and measure hosted intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # the Claude key: this repository keeps it as Claude_key (secret names are not case-sensitive); the
      # conventional names are read too
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_KEY || secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      # a key for several workspaces must name the one each request runs in: an identifier, not a credential
      ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id || vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Check provider credentials
        env:
          SELECTED_PROVIDER: ${{ inputs.provider }}
        run: |
          case "$SELECTED_PROVIDER" in
            google)
              if [ -z "$GEMINI_API_KEY" ]; then
                echo "GEMINI_API_KEY is required when provider=google."
                exit 1
              fi
              ;;
            nvidia)
              if [ -z "$NVIDIA_API_KEY" ]; then
                echo "NVIDIA_API_KEY is required when provider=nvidia."
                exit 1
              fi
              ;;
            anthropic)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "The Claude key (secret Claude_key or ANTHROPIC_API_KEY) is required when provider=anthropic."
                exit 1
              fi
              ;;
            all)
              if [ -z "$GEMINI_API_KEY" ] && [ -z "$NVIDIA_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "Add GEMINI_API_KEY, NVIDIA_API_KEY and/or Claude_key in repository Actions secrets before running this workflow."
                exit 1
              fi
              ;;
            *)
              echo "Unknown provider: $SELECTED_PROVIDER"
              exit 1
              ;;
          esac
      - name: Discover and examine candidates
        env:
          OBJECTIVE: ${{ inputs.objective }}
        run: |
          python3 poc/run_hosted_examination.py \
            --provider "${{ inputs.provider }}" \
            --max-models "${{ inputs.max_models }}" \
            --objective "$OBJECTIVE" \
            --budget-usd "${{ inputs.budget_usd }}" \
            --data-root "$RUNNER_TEMP/cynqra-hosted-examination"
      - name: Publish examination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cynqra-hosted-intelligence
          path: ${{ runner.temp }}/cynqra-hosted-examination
