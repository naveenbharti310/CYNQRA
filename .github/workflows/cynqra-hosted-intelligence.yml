name: cynqra-hosted-intelligence

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Hosted providers to examine
        required: true
        type: choice
        options: [nvidia+groq+mistral+meta, nvidia+groq+mistral, google+nvidia+groq+mistral+meta, google+nvidia, all, nvidia, groq, mistral, meta, groq+mistral, google, anthropic]
        default: nvidia+groq+mistral+meta
      max_models:
        description: Maximum number of current candidates to probe
        required: true
        default: "4"
      objective:
        description: Optional objective to run through the objective intelligence loop (to its first bindings, or to delivery)
        required: false
        default: ""
      objective_set:
        description: "A named set of objectives run one after another against the same Intelligence Layer (p1-validation: location tracking, SaaS, research analysis)"
        required: false
        type: choice
        options: [none, p1-validation]
        default: none
      to_delivery:
        description: Carry the objective on through the work to delivery
        required: false
        type: boolean
        default: false
      max_minutes:
        description: Time limit for each objective's work after its first bindings, in minutes
        required: false
        default: "300"
      price_per_m:
        description: "The providers' price per million tokens, input,output (0,0 for free tiers); empty: list or worst-case prices"
        required: false
        default: ""
      budget_usd:
        description: Hard cap for each objective run, in US dollars
        required: false
        default: "1"
      anthropic_workspace_id:
        description: Claude workspace ID (wrkspc_...), needed when the Claude key is not scoped to one workspace
        required: false
        default: ""
      claude_key_secret:
        description: Which saved Claude key to use
        required: false
        type: choice
        options: [ANTHROPIC_API_KEY, Claude_key]
        default: ANTHROPIC_API_KEY
      replay_run:
        description: "Replay an earlier run of this workflow from its recording (its run id), with the same inputs: no provider is called and nothing is spent"
        required: false
        default: ""

permissions:
  contents: read
  actions: read  # to fetch an earlier run's recording for a replay

jobs:
  # objective "key-check" (or "key-check <the service's web address>" for a key with no known prefix): only say which
  # provider the CLEAN_API_KEY secret is for and whether it accepts it (its free model listing; nothing is generated,
  # nothing else runs, and the key is never printed)
  key-check:
    name: Check a saved key
    if: ${{ startsWith(inputs.objective, 'key-check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which provider the key is for, and whether it accepts it
        env:
          CLEAN_API_KEY: ${{ secrets.CLEAN_API_KEY }}
          OBJECTIVE: ${{ inputs.objective }}
          PYTHONUNBUFFERED: "1"
        run: |
          site="${OBJECTIVE#key-check}"
          site="${site# }"
          python3 poc/run_hosted_examination.py --key-check CLEAN_API_KEY ${site:+--key-site "$site"}

  examine:
    name: Discover and measure hosted intelligence
    if: ${{ !startsWith(inputs.objective, 'key-check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MISTRAL_KEY || secrets.MISTRAL }}
      # Meta's Model API key (Muse Spark), under whichever of these names the repository uses
      META_API_KEY: ${{ secrets.META_API_KEY || secrets.MODEL_API_KEY || secrets.META_MODEL_API_KEY || secrets.MUSE_SPARK_API_KEY || secrets.META_KEY || secrets.META || secrets.LLAMA_API_KEY || secrets.LLAMA }}
      # the Claude key: ANTHROPIC_API_KEY first, then the names this repository has also used (Claude_key; secret
      # names are not case-sensitive)
      # only when Claude is asked for: a key in the environment is connected and examined
      ANTHROPIC_API_KEY: ${{ (inputs.provider == 'all' || inputs.provider == 'anthropic') && (inputs.claude_key_secret == 'Claude_key' && secrets.CLAUDE_KEY || secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_KEY || secrets.CLAUDE_API_KEY) || '' }}
      # a key for several workspaces must name the one each request runs in: an identifier, not a credential
      ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id || vars.ANTHROPIC_WORKSPACE_ID || secrets.ANTHROPIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Check provider credentials
        env:
          SELECTED_PROVIDER: ${{ inputs.provider }}
          REPLAY_RUN: ${{ inputs.replay_run }}
        # each provider named (joined with +) and the key it needs; at least one must be set (the run says which
        # were skipped). The key itself is never printed.
        run: |
          key_for() {
            case "$1" in
              google) echo GEMINI_API_KEY ;; nvidia) echo NVIDIA_API_KEY ;; anthropic) echo ANTHROPIC_API_KEY ;;
              groq) echo GROQ_API_KEY ;; mistral) echo MISTRAL_API_KEY ;; meta) echo META_API_KEY ;; *) echo "" ;;
            esac
          }
          names="$SELECTED_PROVIDER"
          if [ "$names" = "all" ]; then names="google+nvidia+anthropic+groq+mistral+meta"; fi
          found=""
          for p in $(echo "$names" | tr '+' ' '); do
            var="$(key_for "$p")"
            if [ -z "$var" ]; then echo "Unknown provider: $p"; exit 1; fi
            if [ -n "${!var}" ]; then found="$found $p"; else echo "provider $p: $var is not set"; fi
          done
          if [ -z "$found" ] && [ -n "$REPLAY_RUN" ]; then
            echo "replaying run $REPLAY_RUN: no key is needed, nothing is sent to a provider"
          elif [ -z "$found" ]; then
            echo "None of the keys for provider=$SELECTED_PROVIDER is set in the repository's Actions secrets."
            exit 1
          fi
          echo "providers with a key:$found"
      - name: Fetch the recording to replay
        if: ${{ inputs.replay_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: cynqra-hosted-intelligence
          run-id: ${{ inputs.replay_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/replay
      - name: Discover and examine candidates
        # below the job's 360, so the audit and the evidence are kept even when real providers make the run long
        # (run 37044180144 ended 9 minutes before the job limit)
        timeout-minutes: 340
        env:
          OBJECTIVE: ${{ inputs.objective }}
          CYNQRA_PRICE_PER_M: ${{ inputs.price_per_m }}
          REPLAY_RUN: ${{ inputs.replay_run }}
        run: |
          extra=""
          if [ "${{ inputs.to_delivery }}" = "true" ]; then extra="--to-delivery"; fi
          # every run keeps its calls (never a key) so it can be replayed at no cost; a replay answers from one
          if [ -n "$REPLAY_RUN" ]; then
            extra="$extra --replay $RUNNER_TEMP/replay/cynqra-hosted-examination/cassette.jsonl"
          else
            extra="$extra --record $RUNNER_TEMP/cynqra-hosted-examination/cassette.jsonl"
          fi
          python3 poc/run_hosted_examination.py \
            --provider "${{ inputs.provider }}" \
            --max-models "${{ inputs.max_models }}" \
            --objective "$OBJECTIVE" \
            --objective-set "${{ inputs.objective_set }}" \
            --budget-usd "${{ inputs.budget_usd }}" \
            --max-minutes "${{ inputs.max_minutes }}" \
            --live-events \
            --data-root "$RUNNER_TEMP/cynqra-hosted-examination" $extra
      - name: Audit the run from its persisted records
        if: always()
        working-directory: poc
        # every control of the P1 completion mandate (sections 3 to 7 and 10), read from what the run persisted; the
        # job's keys are passed by name so the scan can prove none of them was written anywhere (it never prints one)
        run: |
          root="$RUNNER_TEMP/cynqra-hosted-examination"
          if [ ! -d "$root" ]; then echo "no data root: nothing to audit"; exit 0; fi
          python3 -m cynqra.run_audit "$root" --json "$RUNNER_TEMP/run-audit.json" \
            --secret-env GEMINI_API_KEY NVIDIA_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY MISTRAL_API_KEY META_API_KEY
      - name: Publish examination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cynqra-hosted-intelligence
          path: |
            ${{ runner.temp }}/cynqra-hosted-examination
            ${{ runner.temp }}/run-audit.json
